services:
  - type: web
    name: pezeshkyar-production
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pezeshkyar-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: MAX_UPLOAD_MB
        value: "15"

databases:
  - name: pezeshkyar-db
    plan: free
